# Example configuration for kernel/tools/ (Milestone 33: Safe Computer Task
# Execution; repo_health added in Milestone 34: Safe Repository Health
# Checks; repository_backup added in Milestone 35: Safe Repository
# Backups). Copy this file to kernel/config/tools.yaml and replace every
# placeholder with real, absolute paths for this machine.
#
# kernel/config/tools.yaml is gitignored - it holds real local filesystem
# and application paths for one machine and must never be committed. This
# example file is the only version of this configuration tracked in git,
# and every value below is a synthetic placeholder.
#
# Validation rules (kernel/tools/config.py) - a tools.yaml that violates
# any of these fails to load entirely (fail closed), rather than partially
# applying:
#   - Every path (directory, executable, cwd, interpreter, script_path)
#     must be absolute. A relative path is rejected.
#   - No duplicate keys - not even ones that only collide after
#     case-folding (e.g. "Documents" and "documents" together are
#     rejected).
#   - No unrecognized top-level or per-entry field.
#   - A key the WhatsApp sender types (e.g. "documents", "notepad") is
#     matched case-insensitively against these keys - the resolved path
#     behind it is never sender-supplied.
#   - repo_health.approved_repositories[*].path must be the repository's
#     root directory (where .git lives), not any subdirectory of it - the
#     handler rejects a configured path that resolves to anything other
#     than `git rev-parse --show-toplevel`'s own answer.
#   - repo_health.approved_repositories[*].main_branch is optional and
#     defaults to "main"; if given, it must be a valid git branch name.
#   - repository_backup.approved_backups[*] keys must already exist as a
#     repo_health.approved_repositories key - the repository path is
#     never duplicated here, only looked up by the same key.
#   - repository_backup.approved_backups[*].destination_directory must be
#     an absolute, pre-existing directory - never inside the repository
#     it backs up, and never itself containing that repository.
#   - Every repository_backup.approved_backups key must additionally be
#     filename-safe: lowercase ASCII letters, digits, "_", and "-" only,
#     starting with a letter or digit, at most 64 characters - it is used
#     directly inside the generated backup filename.
#   - approved_files (Milestone 43 P1: file_metadata/read_text_file) names
#     EXACTLY ONE approved file per key - never a directory and never a
#     pattern. Approving a directory elsewhere (list_files) does not imply
#     permission to read or inspect every file inside it; each file that
#     file_metadata/read_text_file may touch must be registered here
#     individually, by its own exact absolute path.
#   - create_directory.approved_directory_creations[*] (Milestone 43 P2)
#     names ONE complete, pre-authorized (parent, child name) pair -
#     parent_directory must already exist as a list_files.approved_directories
#     key (never a duplicated raw path), and directory_name must be a
#     single, safe path component (no path separator, no "." or "..", no
#     drive/UNC syntax, no trailing dot/space, not a Windows reserved
#     device name). Create-only: an existing target of any kind (file,
#     directory, or symlink) is never overwritten.
#   - copy_file.approved_copies[*] (Milestone 43 P2) names ONE complete,
#     pre-authorized (source, destination directory, destination name)
#     triple - source_file must already exist as an approved_files key and
#     destination_directory must already exist as a
#     list_files.approved_directories key (never duplicated raw paths);
#     destination_name follows the same safe-path-component rule
#     directory_name does above. Create-only: an existing destination is
#     never overwritten.

list_files:
  approved_directories:
    documents: "C:/Users/REPLACE_ME/Documents"
    downloads: "C:/Users/REPLACE_ME/Downloads"

open_application:
  approved_applications:
    notepad:
      executable: "C:/Windows/System32/notepad.exe"
      cwd: "C:/Windows/System32"

run_registered_script:
  approved_scripts:
    example_script:
      interpreter: "C:/REPLACE_ME/AI-OS/.venv/Scripts/python.exe"
      script_path: "C:/REPLACE_ME/AI-OS/scripts/REPLACE_ME.py"
      cwd: "C:/REPLACE_ME/AI-OS"
      timeout_seconds: 30

repo_health:
  approved_repositories:
    ai_os:
      path: "C:/REPLACE_ME/AI-OS"
      main_branch: "main"

repository_backup:
  approved_backups:
    ai_os:
      destination_directory: "D:/REPLACE_ME/AI-OS-Backups"

approved_files:
  resume_pdf:
    path: "C:/Users/REPLACE_ME/Documents/resume.pdf"
  notes_txt:
    path: "C:/Users/REPLACE_ME/Documents/notes.txt"

create_directory:
  approved_directory_creations:
    project_exports:
      parent_directory: documents
      directory_name: exports

copy_file:
  approved_copies:
    resume_backup:
      source_file: resume_pdf
      destination_directory: downloads
      destination_name: resume_backup.pdf
