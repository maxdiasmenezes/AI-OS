[project]
name = "ai-os"
version = "0.1.0"
description = "Personal AI Operating System"
requires-python = ">=3.14"
dependencies = [
    "anthropic",
    "psutil>=7.2.2",
    "python-dotenv",
    "pyyaml",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]
